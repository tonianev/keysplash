<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>KeySplash</title>
  <!-- Matte tile (fills the whole square so maskable crops stay clean). -->
  <rect width="512" height="512" fill="#4A86D8"/>
  <!-- Keycap: soft contact shadow, cream cap. -->
  <rect x="124" y="140" width="264" height="252" rx="64" fill="#3A6DB8"/>
  <rect x="124" y="120" width="264" height="252" rx="64" fill="#FBF7F0"/>
  <!-- A bold rounded K in matte red. -->
  <path d="M212 178v136M296 178l-72 70M246 228l56 86" fill="none" stroke="#E0604F" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three small dots: yellow, green, pink. -->
  <circle cx="356" cy="104" r="20" fill="#E9B730"/>
  <circle cx="404" cy="146" r="14" fill="#4FA66A"/>
  <circle cx="400" cy="92" r="10" fill="#DE6FA1"/>
</svg>
